<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      规范域跳转 —— 必须在任何脚本之前跑。

      pinzos.com 和 www.pinzos.com 是**两个不同的 origin**,localStorage 互不相通。
      两个域都直接 200 提供网站(谁也不跳谁),于是:在 www 上登录 → session 存在 www 下;
      下次从书签/微信链接/直接敲域名落到裸域 → 那个 origin 下没有任何 session → 要你重登。
      owner 报的"过一会儿回来就要重新登录"就是这个,和时间无关,和你从哪个地址进来有关。

      正解是在 Cloudflare 边缘做 301(SEO 也更干净);这段是同一件事的应用层兜底,
      两者可以共存 —— 边缘 301 生效后这段永远不会被触发。

      只认死 'pinzos.com' 这一个 hostname:localhost、*.pages.dev 预览、以及任何其它
      域都不受影响。path/query/hash 全部原样带过去(OAuth 的 #access_token 也在 hash 里,
      不能丢)。
    -->
    <script>
      (function () {
        if (location.hostname === 'pinzos.com') {
          location.replace('https://www.pinzos.com' + location.pathname + location.search + location.hash)
        }
      })()
    </script>

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinzos - A New Way to Buy Off-Plan in Dubai</title>
    <meta name="description" content="Pinzos is an interactive Dubai off-plan property platform: a satellite map with real DLD transactions, rents and area metrics, AI brochure parsing, 5-year ROI & Golden-Visa analysis, plus agent tools — real-time co-presence map tours for overseas clients, AI-guided Luna tours, and buyer-intent reports." />
    <meta name="keywords" content="Dubai off-plan, Dubai real estate, DLD transactions, property investment Dubai, Golden Visa, real-time property tour, 迪拜期房, 迪拜房产, 海外带看" />

    <!-- Brand wordmark font (Fraunces display serif) + UI font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph — 分享出去的链接长什么样。
         ⚠️ og:image 必须是**绝对 URL**（原来是 /og-image.jpg，相对路径，
            大多数爬虫直接忽略 → 就算有图也不显示）。
         ⚠️ 这些是**默认值**。分享一场 tour（/v/:code）时，边缘的
            Pages Function（functions/v/[code].ts）会用 HTMLRewriter 把它们
            改写成这场带看的真实信息（客户名 / 经纪名 / 首套房的照片）。
            HTMLRewriter 只能改**已存在**的标签 —— 所以下面每一条都必须在。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pinzos" />
    <meta property="og:url" content="https://www.pinzos.com" />
    <meta property="og:title" content="Pinzos - A New Way to Buy Off-Plan in Dubai" />
    <meta property="og:description" content="Discover premium off-plan properties in Dubai. Browse projects, compare unit types, and find your ideal investment." />
    <meta property="og:image" content="https://www.pinzos.com/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pinzos - A New Way to Buy Off-Plan in Dubai" />
    <meta name="twitter:description" content="Discover premium off-plan properties in Dubai." />
    <meta name="twitter:image" content="https://www.pinzos.com/og-image.jpg" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
  </head>
  <body>

  </body>
</html>
