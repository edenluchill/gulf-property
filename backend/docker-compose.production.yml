# Production Docker Compose for Pinzos Backend
# Database is external (managed PostgreSQL or separate server)

version: '3.8'

services:
  # Backend API service
  api:
    image: ghcr.io/edenluchill/pinzos-backend:latest
    container_name: pinzos-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    # Resource limits for cpx11 (2GB RAM)
    # With worker architecture, API is lightweight - no PDF processing
    deploy:
      resources:
        limits:
          memory: 1500M
          cpus: '1.8'
        reservations:
          memory: 512M
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      # Worker mode: upload PDFs to R2, let worker process them
      - USE_WORKER_MODE=${USE_WORKER_MODE:-true}
      # Smaller heap since we don't process PDFs on API server
      - NODE_OPTIONS=--max-old-space-size=1024
      # Database (external PostgreSQL)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # API Configuration
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Supabase (server-side token validation → requireAuth/approval gating).
      # Without these the container's isSupabaseConfigured=false and auth is skipped.
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Stripe billing (经纪订阅). Values live in /opt/pinzos/.env on the server.
      # Without STRIPE_SECRET_KEY the billing endpoints gracefully return 503.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_AGENT=${STRIPE_PRICE_AGENT}
      - STRIPE_PRICE_FOUNDER=${STRIPE_PRICE_FOUNDER}
      - STRIPE_PRICE_AGENT_Q=${STRIPE_PRICE_AGENT_Q}
      - STRIPE_PRICE_FOUNDER_Q=${STRIPE_PRICE_FOUNDER_Q}
      - STRIPE_PORTAL_CONFIG=${STRIPE_PORTAL_CONFIG}
      - APP_URL=${APP_URL:-https://www.pinzos.com}
      # Agora in-app voice (token signing). Values live in /opt/pinzos/.env on the
      # server. Optional caps (AGORA_*_SECONDS) fall back to code defaults if unset.
      - AGORA_APP_ID=${AGORA_APP_ID}
      - AGORA_APP_CERTIFICATE=${AGORA_APP_CERTIFICATE}
      - AGORA_SESSION_MAX_SECONDS=${AGORA_SESSION_MAX_SECONDS:-1800}
      - AGORA_AGENT_DAILY_SECONDS=${AGORA_AGENT_DAILY_SECONDS:-10800}
      - AGORA_GLOBAL_DAILY_SECONDS=${AGORA_GLOBAL_DAILY_SECONDS:-21600}
      # Cloudflare R2 Configuration (REQUIRED for image storage)
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - API_RATE_LIMIT_WINDOW_MS=${API_RATE_LIMIT_WINDOW_MS:-900000}
      - API_RATE_LIMIT_MAX_REQUESTS=${API_RATE_LIMIT_MAX_REQUESTS:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Logs only - all images stored in Cloudflare R2
      - ./logs:/var/log/pinzos
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${PORT:-3000}/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy (optional, for SSL termination)
  nginx:
    image: nginx:alpine
    container_name: pinzos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro  # Let's Encrypt certificates for upload-api.pinzos.com
    depends_on:
      - api
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  app-network:
    driver: bridge
